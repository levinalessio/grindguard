name: Idea
description: A feature or a change in behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which moment does this fix?
      description: Describe the situation where GrindGuard fails you today – not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: markdown
    attributes:
      value: |
        Not planned, on purpose: cloud, accounts, AI coach, team dashboards, badges. See [docs/ROADMAP.md](../blob/main/docs/ROADMAP.md).
